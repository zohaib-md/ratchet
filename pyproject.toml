[project]
name = "ratchet"
version = "0.1.0"
description = "Benchmark for testing whether agent harness constraints reduce dangerous actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ratchet = "ratchet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratchet"]

